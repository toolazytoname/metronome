name: Native packages

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.set.outputs.name }}
      code: ${{ steps.set.outputs.code }}
    steps:
      - id: set
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "name=0.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi
          echo "code=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

  android:
    needs: version
    runs-on: ubuntu-latest
    env:
      VERSION_NAME: ${{ needs.version.outputs.name }}
      VERSION_CODE: ${{ needs.version.outputs.code }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Decode release keystore if present
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > /tmp/release.jks
            echo "ANDROID_KEYSTORE_PATH=/tmp/release.jks" >> "$GITHUB_ENV"
          fi

      - name: Test and assemble
        env:
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          tasks=":policy:test :app:assembleDebug"
          if [ -n "${ANDROID_KEYSTORE_PATH:-}" ]; then
            tasks="$tasks :app:assembleRelease"
          fi
          ./gradlew $tasks --no-daemon

      - name: Collect APKs
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk \
            "dist/BunnyMetronome-${VERSION_NAME}-debug.apk"
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk \
              "dist/BunnyMetronome-${VERSION_NAME}.apk"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*.apk

  ios:
    needs: version
    runs-on: macos-latest
    env:
      VERSION_NAME: ${{ needs.version.outputs.name }}
      VERSION_CODE: ${{ needs.version.outputs.code }}
    steps:
      - uses: actions/checkout@v4

      - name: Policy tests
        run: cd ios && swift test

      - name: Unsigned iphoneos build
        run: |
          xcodebuild \
            -project ios/BunnyMetronome.xcodeproj \
            -scheme BunnyMetronome \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/ios-dd" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION="$VERSION_CODE" \
            MARKETING_VERSION="$VERSION_NAME" \
            build

      - name: Pack unsigned IPA
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/ios-dd/Build/Products/Release-iphoneos/BunnyMetronome.app"
          test -d "$APP"
          mkdir -p dist
          work=$(mktemp -d)
          mkdir "$work/Payload"
          cp -R "$APP" "$work/Payload/"
          (cd "$work" && zip -qry "$GITHUB_WORKSPACE/dist/BunnyMetronome-${VERSION_NAME}-unsigned.ipa" Payload)
          if [ -d "$APP.dSYM" ]; then
            (cd "$RUNNER_TEMP/ios-dd/Build/Products/Release-iphoneos" \
              && zip -qry "$GITHUB_WORKSPACE/dist/BunnyMetronome-${VERSION_NAME}.app.dSYM.zip" BunnyMetronome.app.dSYM)
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [version, android, ios]
    runs-on: ubuntu-latest
    env:
      VERSION_NAME: ${{ needs.version.outputs.name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: GitHub Release
        run: |
          set -euo pipefail
          notes="Native packages for ${VERSION_NAME}.

          - Android debug APK: sideload OK. Sound Workshop stays locked unless Play Billing is available. Same package name as Play: do not give the pack away.
          - Android signed APK: only present if keystore secrets are set. Still not uploaded to Play.
          - iOS unsigned IPA: CI build with CODE_SIGNING_ALLOWED=NO. Cannot install on a device and cannot upload to App Store Connect. Re-sign locally for TestFlight.

          This workflow does not submit to App Store or Play."
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" artifacts/* \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" artifacts/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "Bunny Metronome ${VERSION_NAME}" \
              --notes "$notes"
          fi
