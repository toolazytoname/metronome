name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Lint miniapp JS
        run: |
          # Syntax check all JS files with Node.js
          for f in miniapp/pages/index/index.js miniapp/app.js; do
            echo "Checking $f..."
            node --check "$f" || { echo "SYNTAX ERROR in $f"; exit 1; }
          done
          echo "✅ All JS files syntax OK"

      - name: Validate JSON files
        run: |
          for f in miniapp/app.json miniapp/project.config.json miniapp/sitemap.json miniapp/pages/index/index.json; do
            echo "Checking $f..."
            python3 -c "import json; json.load(open('$f'))" || { echo "JSON ERROR in $f"; exit 1; }
          done
          echo "✅ All JSON files valid"

      - name: Check audio files exist
        run: |
          for f in click-strong.mp3 click-weak.mp3 click-uniform.mp3 voice/zh/01.mp3 voice/en/01.mp3; do
            if [ ! -f "miniapp/assets/sounds/$f" ]; then
              echo "MISSING: $f"
              exit 1
            fi
            size=$(stat -c%s "miniapp/assets/sounds/$f")
            if [ "$size" -gt 2097152 ]; then
              echo "FILE TOO LARGE ($size bytes): $f (max 2MB)"
              exit 1
            fi
            echo "  ✅ $f ($size bytes)"
          done
          zh_count=$(ls miniapp/assets/sounds/voice/zh/*.mp3 | wc -l)
          en_count=$(ls miniapp/assets/sounds/voice/en/*.mp3 | wc -l)
          if [ "$zh_count" -lt 16 ] || [ "$en_count" -lt 16 ]; then
            echo "❌ expected 16 voice samples per language, got zh=$zh_count en=$en_count"
            exit 1
          fi
          echo "✅ voice samples zh=$zh_count en=$en_count"

      - name: Check web audio + engine
        run: |
          for f in assets/sounds/click-strong.mp3 js/engine.js sw.js; do
            if [ ! -f "$f" ]; then
              echo "MISSING: $f"
              exit 1
            fi
            echo "  ✅ $f"
          done
          node --check js/engine.js
          node --check sw.js

      - name: Web behaviour tests
        run: |
          node scripts/test_web_prefs.js
          node scripts/test_sw_fetch.js
          node scripts/test_engine.js
          node scripts/test_web_start.js
          node scripts/test_longtail.js
          echo "✅ web prefs / SW / engine / longtail tests ok"

      - name: Miniapp unit tests
        run: |
          cd miniapp
          npm ci
          npm test
          echo "✅ miniapp vitest ok"

      - name: Check leftover speechSynthesis is gone
        run: |
          if grep -q "speechSynthesis" index.html en/index.html js/engine.js; then
            echo "❌ speechSynthesis should not be used for the beat clock"
            exit 1
          fi
          echo "✅ no speechSynthesis on the beat path"

      - name: Check AGENTS.md still matches the repo
        run: |
          for needle in js/engine.js miniapp/pages/index/index.js metronome studio.weichao.jpq.soundpack playback; do
            if ! grep -q "$needle" AGENTS.md; then
              echo "❌ AGENTS.md missing required mention: $needle"
              exit 1
            fi
          done
          if grep -E -n 'category\s*=\s*\.?playAndRecord|AVAudioSessionCategoryPlayAndRecord' AGENTS.md docs/engine-contract.md docs/architecture.md; then
            echo "❌ do not prescribe an iOS recording audio session"
            exit 1
          fi
          if grep -n "无内购" README.md landing.html index.html; then
            echo "❌ public copy still claims 无内购"
            exit 1
          fi
          if grep -n "no in-app purchases" README.en.md en/landing.html en/index.html; then
            echo "❌ public copy still claims no in-app purchases"
            exit 1
          fi
          echo "✅ agent docs + public copy checks ok"

      - name: Check legal pages
        run: |
          for f in privacy.html support.html en/privacy.html en/support.html; do
            test -f "$f" || { echo "MISSING $f"; exit 1; }
          done
          for needle in "无账号" "音色工坊" "恢复购买" "lazywc@gmail.com"; do
            grep -q "$needle" privacy.html support.html || { echo "zh legal missing $needle"; exit 1; }
          done
          for needle in "no-account" "Sound Workshop" "Restore purchases" "lazywc@gmail.com"; do
            grep -q "$needle" en/privacy.html en/support.html || { echo "en legal missing $needle"; exit 1; }
          done
          echo "✅ legal pages ok"

      - name: Check native sources exist
        run: |
          for f in \
            ios/BunnyMetronome/Engine/MetronomePolicy.swift \
            ios/BunnyMetronome/Engine/BeatScheduler.swift \
            ios/BunnyMetronome/Engine/MetronomeAudioEngine.swift \
            ios/BunnyMetronome/BunnyMetronomeApp.swift \
            ios/BunnyMetronome/Store/StoreAdapter.swift \
            android/policy/src/main/kotlin/studio/weichao/jpq/policy/MetronomePolicy.kt \
            android/app/src/main/java/studio/weichao/jpq/audio/AudioTrackClock.kt \
            android/app/src/main/java/studio/weichao/jpq/audio/MetronomeService.kt \
            android/app/src/main/java/studio/weichao/jpq/MainActivity.kt \
            android/app/src/main/java/studio/weichao/jpq/billing/PlayStoreAdapter.kt \
            privacy.html support.html
          do
            test -f "$f" || { echo "MISSING $f"; exit 1; }
          done
          test -d assets/sounds/pack/click-stick
          test -d assets/sounds/pack/click-kick
          test -d assets/sounds/pack/click-tip
          echo "✅ native sources + pack clicks present"

      - name: Check native icons and privacy
        run: |
          test -s ios/BunnyMetronome/Assets.xcassets/AppIcon.appiconset/AppIcon.png
          test -f ios/BunnyMetronome/PrivacyInfo.xcprivacy
          grep -q 'ITSAppUsesNonExemptEncryption' ios/BunnyMetronome/Info.plist
          test -s android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          test -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          echo "✅ native icons + privacy files present"

  ios-policy:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Swift policy tests
        run: cd ios && swift test

  android-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: JVM policy tests
        run: cd android && ./gradlew :policy:test --no-daemon

  miniapp-structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify miniapp structure
        run: |
          required_files=(
            "miniapp/app.js"
            "miniapp/app.json"
            "miniapp/app.wxss"
            "miniapp/project.config.json"
            "miniapp/pages/index/index.js"
            "miniapp/pages/index/index.wxml"
            "miniapp/pages/index/index.wxss"
            "miniapp/pages/index/index.json"
            "miniapp/assets/sounds/click-strong.mp3"
            "miniapp/assets/sounds/click-weak.mp3"
            "miniapp/assets/sounds/click-uniform.mp3"
          )
          for f in "${required_files[@]}"; do
            if [ ! -f "$f" ]; then
              echo "MISSING: $f"
              exit 1
            fi
            echo "  ✅ $f"
          done